<svg xmlns="http://www.w3.org/2000/svg" class="laya-diagram" viewBox="0 0 900 380" width="900" height="380" role="img" aria-labelledby="t2 d2">
  <title id="t2">The cascade next to an LLM</title>
  <desc id="d2">A request reaches Laya first, which routes, gates or scores it in milliseconds. Most requests are then handled by ordinary code; the ones that need text go to a local language model; only the escalated minority reaches a frontier model.</desc>
  <style>
    .laya-diagram { --ink: #121729; --muted: #5F6883; --line: #C6CCDB; --track: #E9ECF3; --accent: #2A56E8; --accent2: #DE5F0A;
      color: var(--ink); font-family: ui-sans-serif, system-ui, -apple-system, "Segoe UI", Helvetica, Arial, sans-serif; font-size: 13px; }
    @media (prefers-color-scheme: dark) {
      .laya-diagram { --ink: #E9EDF7; --muted: #8B95B3; --line: #2B3758; --track: #1B2440; --accent: #5583FF; --accent2: #FF8C33; }
    }
    .laya-diagram .box { fill: none; stroke: var(--line); stroke-width: 1; rx: 6; }
    .laya-diagram .box.laya { stroke: var(--accent); stroke-width: 1.5; }
    .laya-diagram .box.dashed { stroke-dasharray: 4 4; }
    .laya-diagram .t { fill: currentColor; }
    .laya-diagram .m { fill: var(--muted); }
    .laya-diagram .mono { font-family: ui-monospace, SFMono-Regular, Menlo, Consolas, monospace; font-size: 12px; }
    .laya-diagram .small { font-size: 11px; }
    .laya-diagram .head { font-size: 14px; font-weight: 600; }
    .laya-diagram .arrow { stroke: var(--muted); stroke-width: 1.2; fill: none; }
    .laya-diagram .arrow.main { stroke: var(--accent); stroke-width: 1.6; }
    .laya-diagram .arrow.thin { stroke-dasharray: 3 4; }
    .laya-diagram .ah { fill: var(--muted); }
    .laya-diagram .ah.main { fill: var(--accent); }
    .laya-diagram .lat { fill: var(--accent2); font-family: ui-monospace, SFMono-Regular, Menlo, Consolas, monospace; font-size: 12px; }
    .laya-diagram .share { fill: var(--muted); font-size: 11px; }
    .laya-diagram .bar { fill: var(--track); }
    .laya-diagram .bar-fill { fill: var(--accent); }
    .laya-diagram .bar-fill.dim { fill: var(--line); }
  </style>

  <!-- request -->
  <rect class="box" x="20" y="150" width="120" height="80"/>
  <text class="t head" x="80" y="186" text-anchor="middle">request</text>
  <text class="m small" x="80" y="206" text-anchor="middle">ticket, email, tool call,</text>
  <text class="m small" x="80" y="220" text-anchor="middle">PR, chat message</text>

  <path class="arrow main" d="M142 190 H182"/><path class="ah main" d="M182 185 l9 5 -9 5z"/>

  <!-- laya -->
  <rect class="box laya" x="196" y="130" width="220" height="120"/>
  <text class="t head" x="306" y="160" text-anchor="middle">Laya decides</text>
  <text class="m" x="306" y="180" text-anchor="middle">route, gate, score, rank</text>
  <text class="m small" x="306" y="198" text-anchor="middle">typed answers with probabilities</text>
  <text class="lat" x="306" y="234" text-anchor="middle">milliseconds</text>

  <!-- branches -->
  <path class="arrow main" d="M418 170 C470 170 470 70 520 70"/><path class="ah main" d="M520 65 l9 5 -9 5z"/>
  <path class="arrow" d="M418 190 H520"/><path class="ah" d="M520 185 l9 5 -9 5z"/>
  <path class="arrow thin" d="M418 210 C470 210 470 310 520 310"/><path class="ah" d="M520 305 l9 5 -9 5z"/>

  <text class="share" x="470" y="58" text-anchor="middle">most</text>
  <text class="share" x="470" y="182" text-anchor="middle">some</text>
  <text class="share" x="470" y="326" text-anchor="middle">few</text>

  <!-- your code -->
  <rect class="box" x="534" y="26" width="346" height="88"/>
  <text class="t head" x="550" y="52">your code</text>
  <text class="lat" x="864" y="52" text-anchor="end">microseconds</text>
  <text class="m" x="550" y="72">the deterministic branch: route the ticket,</text>
  <text class="m" x="550" y="88">file the email, allow or deny the tool call</text>
  <rect class="bar" x="550" y="98" width="314" height="5" rx="2"/><rect class="bar-fill" x="550" y="98" width="220" height="5" rx="2"/>

  <!-- local llm -->
  <rect class="box" x="534" y="146" width="346" height="88"/>
  <text class="t head" x="550" y="172">local language model, next door</text>
  <text class="lat" x="864" y="172" text-anchor="end">seconds</text>
  <text class="m" x="550" y="192">generation for the requests that need text:</text>
  <text class="m" x="550" y="208">a reply, a summary, an explanation</text>
  <rect class="bar" x="550" y="218" width="314" height="5" rx="2"/><rect class="bar-fill dim" x="550" y="218" width="78" height="5" rx="2"/>

  <!-- frontier -->
  <rect class="box dashed" x="534" y="266" width="346" height="88"/>
  <text class="t head" x="550" y="292">frontier model</text>
  <text class="lat" x="864" y="292" text-anchor="end">seconds, and a bill</text>
  <text class="m" x="550" y="312">only the escalated minority: low confidence,</text>
  <text class="m" x="550" y="328">high blast radius, complex work</text>
  <rect class="bar" x="550" y="338" width="314" height="5" rx="2"/><rect class="bar-fill dim" x="550" y="338" width="16" height="5" rx="2"/>

  <text class="m small" x="450" y="372" text-anchor="middle">the expensive path is reached by decision, not by default</text>
</svg>
