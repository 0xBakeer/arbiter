[project]
name = "arbiter-mcp"
version = "0.1.0"
description = "MCP tools for fast typed decisions from a self-hosted arbiter server"
requires-python = ">=3.10"
dependencies = ["mcp>=2"]

[project.scripts]
arbiter-mcp = "arbiter_mcp:main"

[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[tool.setuptools]
py-modules = ["arbiter_mcp"]
