[project]
name = "laya-mcp"
version = "0.1.0"
description = "MCP tools for fast typed decisions from a self-hosted Laya System One server"
requires-python = ">=3.10"
dependencies = ["mcp>=2"]

[project.scripts]
laya-mcp = "laya_mcp:main"

[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[tool.setuptools]
py-modules = ["laya_mcp"]
