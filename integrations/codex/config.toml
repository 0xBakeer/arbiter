# Add this to ~/.codex/config.toml (user-wide) or .codex/config.toml (this project only).
# Replace /ABS/PATH with the absolute path to your checkout.

[mcp_servers.arbiter]
command = "python3"
args = ["/ABS/PATH/integrations/mcp/arbiter_mcp.py"]
env = { ARBITER_URL = "http://localhost:8010", ARBITER_MODEL = "auto" }
startup_timeout_sec = 15

# With the package installed (`pip install /ABS/PATH/integrations/mcp`) the command is simply:
#
#   [mcp_servers.arbiter]
#   command = "arbiter-mcp"
#   env = { ARBITER_URL = "http://localhost:8010" }
